site_name: "Anwesha Chakraborty — Research Portfolio"
site_description: "Portfolio of Anwesha Chakraborty — Plant Biology, Biochar Research, Bioinformatics, IIT Bombay"
site_author: "Anwesha Chakraborty"

theme:
  name: material
  icon:
    logo: material/leaf
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  font:
    text: Inter
    code: Roboto Mono

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: "Copyright &copy; Anwesha Chakraborty | v1.0"

extra:
  social:
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0002-6110-3770
    - icon: material/email
      link: mailto:24d1261@iitb.ac.in

plugins:
  - search
  - meta

nav:
  - Home: index.md
  - Research:
    - "All Projects": projects/index.md
    - "PhD Research — Biochar & Soil Microbiology": projects/phd-research.md
    - "MS Dissertation — Stress-Responsive Gene Promoters": projects/ms-dissertation.md
    - "Magnaporthe oryzae Effectors (Internship)": projects/magnaporthe-project.md
  - Publications: publications.md
  - Experience: experience.md
  - Contact: contact.md
